name: QA Cafe CI Pipeline

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  test-and-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pip-audit

      - name: Check Python code
        run: |
          flake8 . \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics \
            --exclude=.git,__pycache__,instance,.pytest_cache

      - name: Run automated tests
        run: |
          python -m pytest -v

      - name: Run dependency security scan
        continue-on-error: true
        run: |
          pip-audit

      - name: Package application
        run: |
          zip -r qa-cafe-workforce-app.zip . \
            -x ".git/*" \
            -x "instance/*" \
            -x "__pycache__/*" \
            -x ".pytest_cache/*"

      - name: Upload packaged application
        uses: uses: actions/upload-artifact@v6
        with:
          name: qa-cafe-workforce-application
          path: qa-cafe-workforce-app.zip