{% extends "base.html" %}

{% block content %}
<section class="page-header">
    <h2>Login</h2>
    <p>Sign in using an authorised fictional QA Café account.</p>
</section>

<form method="POST">
    <div>
        <label for="username">Username</label>
        <input
            type="text"
            id="username"
            name="username"
            autocomplete="username"
            required
        >
    </div>

    <div>
        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            name="password"
            autocomplete="current-password"
            required
        >
    </div>

    <button type="submit">Login</button>
</form>
{% endblock %}
