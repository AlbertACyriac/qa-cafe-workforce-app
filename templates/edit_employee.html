{% extends "base.html" %}

{% block content %}
<section class="page-header">
    <h2>Edit Employee</h2>
    <p>Update this fictional QA Café employee record.</p>
</section>

<form method="POST">
    <div>
        <label for="name">Full Name</label>
        <input
            type="text"
            id="name"
            name="name"
            value="{{ employee.name }}"
            maxlength="100"
            required
        >
    </div>

    <div>
        <label for="start_date">Start Date</label>
        <input
            type="date"
            id="start_date"
            name="start_date"
            value="{{ employee.start_date.isoformat() }}"
            required
        >
    </div>

    <div>
        <label for="job_role">Job Role</label>
        <input
            type="text"
            id="job_role"
            name="job_role"
            value="{{ employee.job_role }}"
            maxlength="100"
            required
        >
    </div>

    <div>
        <label for="holiday_allowance">Holiday Allowance</label>
        <input
            type="number"
            id="holiday_allowance"
            name="holiday_allowance"
            value="{{ employee.holiday_allowance }}"
            min="0"
            max="40"
            required
        >
    </div>

    <div>
        <label for="site_id">Site</label>
        <select id="site_id" name="site_id" required>
            {% for site in sites %}
            <option
                value="{{ site.id }}"
                {% if site.id == employee.site_id %}selected{% endif %}
            >
                {{ site.name }}
            </option>
            {% endfor %}
        </select>
    </div>

    <button type="submit">Save Changes</button>

    <a href="{{ url_for('employees') }}">Cancel</a>
</form>
{% endblock %}
